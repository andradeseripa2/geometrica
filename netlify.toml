[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Painel e páginas de sistema fora do Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# CSS e JS: o endereço muda a cada publicação (?v=...), então podem ficar em cache.
# Imagens: cache de 1 dia, para trocas feitas pelo painel aparecerem logo.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
