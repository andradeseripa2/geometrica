<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel · GeoMétrica SIG</title>
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
<script>
  // Prévia das notícias com a cara do site
  if (window.CMS) {
    CMS.registerPreviewStyle("/assets/css/site.css");
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap");
  }
</script>
<style>
  #publicar { position: fixed; right: 20px; bottom: 20px; z-index: 9999; font: 600 14px system-ui, sans-serif; background: #FF5A1F; color: #111410; border: 0; border-radius: 6px; padding: 14px 20px; box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }
  #publicar[disabled] { opacity: .7; cursor: wait; }
  #publicar-msg { position: fixed; right: 20px; bottom: 76px; z-index: 9999; font: 14px system-ui, sans-serif; background: #1D2A21; color: #F2F0E6; border-radius: 6px; padding: 10px 14px; max-width: 320px; display: none; }
</style>
<div id="publicar-msg" role="status"></div>
<button id="publicar" type="button" hidden>Publicar site</button>
<script>
  // Botão "Publicar site": coloca no ar, de uma vez, tudo o que foi salvo no painel.
  (function () {
    var btn = document.getElementById("publicar");
    var msg = document.getElementById("publicar-msg");
    function aviso(t, erro) {
      msg.textContent = t;
      msg.style.background = erro ? "#8A1C1C" : "#1D2A21";
      msg.style.display = "block";
    }
    function mostrar() { btn.hidden = !(window.netlifyIdentity && netlifyIdentity.currentUser()); }
    if (window.netlifyIdentity) {
      netlifyIdentity.on("init", mostrar);
      netlifyIdentity.on("login", mostrar);
      netlifyIdentity.on("logout", mostrar);
    }
    btn.addEventListener("click", function () {
      var u = window.netlifyIdentity && netlifyIdentity.currentUser();
      if (!u) { aviso("Sessão expirada. Entre no painel de novo.", true); return; }
      btn.disabled = true; btn.textContent = "Publicando…"; msg.style.display = "none";
      u.jwt(true) // força token novo
        .then(function (token) {
          return fetch("/.netlify/functions/publicar", {
            method: "POST",
            headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
            body: "{}",
            cache: "no-store"
          });
        })
        .then(function (r) {
          return r.text().then(function (t) {
            var dados = null;
            try { dados = JSON.parse(t); } catch (e) {}
            if (r.ok && dados && dados.ok === true) {
              aviso("Pronto! As alterações entram no ar em 1 a 2 minutos.", false);
            } else {
              var detalhe = (dados && dados.mensagem) || ("resposta inesperada (HTTP " + r.status + ")");
              aviso("Não foi possível publicar: " + detalhe, true);
              console.error("[publicar]", r.status, t);
            }
          });
        })
        .catch(function (e) { aviso("Falha de conexão: " + (e && e.message), true); })
        .finally(function () { btn.disabled = false; btn.textContent = "Publicar site"; });
    });
  })();
</script>
</body>
</html>
